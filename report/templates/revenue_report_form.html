{% extends 'common_dashboard.html' %}
{% load crispy_forms_tags %}
{% load static %}
{% block content %}

<style>
/* Reuse same minimal style */
.form-header {
  background-color: #699ff5;
  border: 1px solid #e3e6ea;
  border-radius: 6px;
  padding: 14px 16px;
  margin-bottom: 20px;
}

.form-header h5 {
  margin: 0;
  font-weight: 600;
}

.form-header small {
  color: #000000;
}

.form-label {
  font-size: 13px;
  color: #495057;
}

.required {
  color: red;
}

.error-msg {
  font-size: 12px;
  color: red;
  display: none;
}
</style>

<div id="RevenueDetails">
  <form id="certificateReportForm">

    <div class="card border-0 shadow-sm mt-3">
      <div class="card-body p-4">

        <!-- HEADER -->
        <div class="form-header">
          <h5>Revenue Report</h5>
          <small>Filter and generate report</small>
        </div>

        <!-- FORM -->
        <div class="row g-3">

          <!-- FROM DATE -->
          <div class="col-md-6">
            <label class="form-label">
              From Date <span class="required">*</span>
            </label>
            <input type="date" class="form-control" id="fromDate" name="fromDate">
            <div class="error-msg" id="fromDateErrorMsg">Select From Date</div>
          </div>

          <!-- TO DATE -->
          <div class="col-md-6">
            <label class="form-label">
              To Date <span class="required">*</span>
            </label>
            <input type="date" class="form-control" id="toDate" name="toDate">
            <div class="error-msg" id="toDateErrorMsg">Select To Date</div>
          </div>

        </div>

        <!-- ACTION BUTTON -->
        <div class="d-flex justify-content-end mt-4">
          <button type="button" class="btn btn-primary btn-sm" onclick="viewECIssuedList()">
            View Report
          </button>
        </div>

      </div>
    </div>

  </form>
</div>

<script>
function viewECIssuedList() {
    const from_date = $('#fromDate').val();
    const to_date = $('#toDate').val();

    let valid = true;

    if (!from_date) {
        $('#fromDateErrorMsg').show();
        valid = false;
    } else {
        $('#fromDateErrorMsg').hide();
    }

    if (!to_date) {
        $('#toDateErrorMsg').show();
        valid = false;
    } else {
        $('#toDateErrorMsg').hide();
    }

    if (from_date && to_date && from_date > to_date) {
        $('#toDateErrorMsg').text("To Date must be on or after From Date").show();
        valid = false;
    }

    if (!valid) return;

    $.ajax({
        type: "GET",
        url: "{% url 'revenue_report' %}",
        data: {
            'from_date': from_date,
            'to_date': to_date
        },
        success: function(data) {
            $('#RevenueDetails').html(data);
        }
    });
}
</script>

{% endblock %}
