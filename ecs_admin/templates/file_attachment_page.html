
    <table id="basic-datatable" class="table dt-responsive nowrap w-100">
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">File</th>
            <th scope="col">Action</th>
        </tr>
    </thead>
    <tbody>
       {% for file_attach in file_attach %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td><a href='{{file_attach.file_path}}' target="_blank">{{file_attach.attachment}},{{file_attach.application_no}}</a></td>
                    <td>
                        <button  type="button" class="btn btn-outline-danger btn-sm" data-toggle="tooltip" title="Delete" onclick="delete_attachment('{{ file_attach.file_id }}','{{ file_attach.attachment_type }}', '{{ file_attach.application_no }}')"><i class="uil-trash"></i></button>
                    </td>
                </tr>
                {% empty %}
                <tr>
                  <td colspan="3" class="text-center">No Data</td>
                </tr>
       {% endfor %}
    </tbody>
</table>
<script>
    function delete_attachment(file_id, attachment_type, application_no)
    {
        $.ajax({
            type : "POST",
            url : "{% url 'delete_attachment' %}",
            data : {
                'file_id': file_id,
                'attachment_type': attachment_type,
                'application_no': application_no,
                'csrfmiddlewaretoken': '{{ csrf_token }}'
            },
            success : function(responseText)
            {

                // Dynamically target the div based on attachment_type
                // Example: If attachment_type is 'FO', it updates #FO_attachment
                // Example: If attachment_type is 'GEN', it updates #GEN_attachment
                $('#' + attachment_type + '_attachment').html(responseText);
            }
        });
    }
</script>
