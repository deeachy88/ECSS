{% load static %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12 mt-3">
            <div class="card">
                <div class="col-xxl-6 col-md-6">
                    <div class="card">
                        <div class="card-body">
                        <h4 class="header-title">Download Forms</h4>
                            <div class="list-group">
                                {% for download in download_forms %}
                                    <a href='{{download.file_path}}' target="_blank" class="list-group-item list-group-item-action active">{{download.attachment}}</a>
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
