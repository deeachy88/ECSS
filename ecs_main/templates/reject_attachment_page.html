
    <table id="basic-datatable" class="table dt-responsive nowrap w-100">
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">File</th>
            <th scope="col">Action</th>
        </tr>
    </thead>
    <tbody>
       {% for file_attach in reject_attach %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td><a href='{{file_attach.file_path}}' target="_blank">{{file_attach.attachment}}</a></td>
                    <td>
                        <button  type="button" class="btn btn-outline-danger btn-sm" data-toggle="tooltip" title="Delete" onclick="delete_reject_attachment('{{ file_attach.file_id }}','{{ file_attach.attachment_type }}','{{ file_attach.document_id }}', '{{ file_attach.application_no }}')"><i class="uil-trash"></i></button>
                    </td>
                </tr>
                {% empty %}
                <tr>
                  <td colspan="3" class="text-center">No Data</td>
                </tr>
       {% endfor %}
    </tbody>
</table>
<script>
    function delete_reject_attachment(file_id, attachment_type, document_id, application_no) {
        // Basic validation
        if (!file_id || !attachment_type || !application_no) {
            console.error('Missing required parameters');
            alert('Error: All fields are required for deletion.');
            return;
        }

        $.ajax({
            type: "POST",
            url: "{% url 'delete_attachment' %}",
            data: {
                file_id: file_id,
                attachment_type: attachment_type,
                application_no: application_no,
                csrfmiddlewaretoken: '{{ csrf_token }}'
            },
            success: function(responseText) {
                const attachmentMap = {
                    'M': '#menu_file_attachment',
                    'SM': '#sub_menu_file_attachment',
                    'H': '#home_page_file_attachment',
                    'FO': '#forest_file_attachment',
                    'IEE': '#iee_file_attachment',
                    'EA': '#ea_file_attachment',
                    'GW': '#ground_water_attachment',
                    'GEN': '#general_attachment',
                    'TRA': '#transmission_attachment',
                    'RRJ': (
                        // Focus on the visible div
                        $('.reject_attachment_div').is(':visible')
                            ? '#reviewer_reject_file_attachment'
                            : ($('.reject_attachment_div_v').is(':visible')  // Changed from $$
                              ? '#verifier_reject_file_attachment'
                              : null)
                        )
                };

                if (attachmentMap.hasOwnProperty(attachment_type)) {
                    $(attachmentMap[attachment_type]).html(responseText);
                } else {
                    console.error('Unknown attachment type: ' + attachment_type);
                }
            },
            error: function(xhr, status, error) {
                console.error('AJAX Error: ' + error);
                alert('Failed to delete attachment. Please try again or check the logs.');
            },
            complete: function() {
                // Optional: Update UI or log completion
            }
        });
    }
</script>
