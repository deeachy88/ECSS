{% extends 'common_dashboard.html' %}
{% load crispy_forms_tags %}
{% block content %}
{% load static %}
<div class="row">
    <div class="col-xl-12">
        <div class="card mt-1">
            <div class="card-body">
                <h5 class="card-title mb-0">
                    <i class="fas fa-plus-circle"></i>
                    New Application - Please Click on the Relevant Activity
                </h5>

                <div id="cardCollpase1" class="collapse pt-3 show">
                    <!-- Table with DataTable Search -->
                    <div class="table-responsive">
                        <table id="basic-datatable" class="table dt-responsive table-sm table-centered mb-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Activity</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for bsic_code_list in bsic_details %}
                                    <tr>
                                        <td>{{ forloop.counter }}</td>
                                        <td>
                                            <!--<a href="javascript:void(0);"
                                                class="btn btn-link text-info mb-0"
                                                onclick="viewApplicationDetails('{{bsic_code_list.activity}}')">
                                                {{bsic_code_list.activity}}
                                            </a>
                                            -->
                                            <a href="javascript:void(0);"
                                               class="btn btn-outline-primary btn-sm"
                                               onclick="viewApplicationDetails('{{bsic_code_list.activity}}')">
                                                {{bsic_code_list.activity}}
                                            </a>
                                        </td>
                                    </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                    <div id="alertMsg" class="alert alert-danger" style="display: none;"></div>
                </div>
            </div>
        </div> <!-- end card-->
    </div>
</div>

<script>
    $(document).ready(function() {
        $('#basic-datatable').DataTable({
            "pageLength": 10,
            "language": {
                "search": "Search Activity:"
            }
        });
    });

    function viewApplicationDetails(activity) {
        $.ajax({
            type: "GET",
            url: "{% url 'get_application_service_id' %}",
            data: {
                activity: activity
            },
            success: function(data) {
                const colour_code = data.colour_code;
                const has_tor = data.has_tor;
                const mas_integration = data.mas_integration;

                // Green category
                if (colour_code === 'Green') {

                    $('#alertMsg')
                        .html("No need for Environment Clearance.")
                        .show()
                        .delay(2000)
                        .fadeOut('slow');

                    return;
                }

                // TOR required only if:
                // has_tor == 'Yes' AND colour_code == 'Red'
                if (has_tor === 'Yes' && colour_code === 'Red') {
                    window.location.href = '/tor_form';
                } else {
                    window.location.href = '/application_form';
                }
            },
            error: function(xhr, status, error) {
                console.error("Error fetching application details:", error);

                $('#alertMsg')
                    .html("Something went wrong. Please try again.")
                    .show()
                    .delay(2000)
                    .fadeOut('slow');
            }
        });
    }
</script>

{% endblock %}
